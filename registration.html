<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - Terry's Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>TERRY'S STORE</h1>
        <p>Style. Quality. Affordability.</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="AboutUs.html">About Us</a>
        <a href="products.html">Products</a>
        <a href="registration.html">Register</a>
    </nav>

    <div class="form-container">

        <h2>Customer Registration</h2>
        <p style="text-align:center;">Create an account with Terry's Store.</p>

        <form action="#" method="post">

            <label>Full Name</label>
            <input type="text" name="fullname" placeholder="Enter your full name" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Enter your phone number" required>

            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Gender</label>
            <select name="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Prefer not to say</option>
            </select>

            <label>County</label>
            <input type="text" name="county" placeholder="Enter your county" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Confirm your password" required>

            <button type="submit">Register</button>

        </form>
    </div>

    <footer>
        <p>2026 Terry's Store. All Rights Reserved.</p>
    </footer>

</body>
</html>
